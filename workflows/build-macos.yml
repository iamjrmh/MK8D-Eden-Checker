name: Build macOS Binary

# Manual only. Run it from the Actions tab, then download the built
# "EdenCheckerMac" binaries from the run's Artifacts section.
# Builds both Apple Silicon (arm64) and Intel (x86_64).
on:
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AppleSilicon
            runner: macos-14   # Apple Silicon (arm64)
          - arch: Intel
            runner: macos-13   # Intel (x86_64)

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build macOS binary
        run: pyinstaller --onefile --console --name EdenCheckerMac eden_update.py

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: EdenCheckerMac-${{ matrix.arch }}
          path: dist/EdenCheckerMac
          if-no-files-found: error
