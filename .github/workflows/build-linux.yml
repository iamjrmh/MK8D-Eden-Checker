name: Build Linux Binary

# Manual only. Run it from the Actions tab, then download the built
# "EdenCheckerLinux" binary from the run's Artifacts section.
on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Linux binary
        run: pyinstaller --onefile --console --name EdenCheckerLinux eden_update.py

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: EdenCheckerLinux
          path: dist/EdenCheckerLinux
          if-no-files-found: error
